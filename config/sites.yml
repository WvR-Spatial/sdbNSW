# Study sites, ordered by expected water clarity: best case first.
# Bounding boxes are MEASURED from the NSW Marine LiDAR 2018 coverage index
# (data/reference/jervisbay_lidar_blocks.geojson), not estimated.

defaults:
  collection: sentinel-2-l2a
  stac_url: https://earth-search.aws.element84.com/v1
  window_days: 45          # +/- around each capture date
  max_cloud: 40            # scene-level %, deliberately loose: scene cloud is a
                           # poor proxy for cloud over a small AOI. Filter hard later.
  max_nodata: 5            # % of scene that is swath-edge nodata. Applied only to
                           # items with no footprint: where AOI coverage can be
                           # measured it decides alone (sdb.stac.classify_candidates)

sites:
  jervis_bay:
    label: "Jervis Bay"
    role: "best case — sheltered, clear, mixed substrate"
    # JervisBay2018_DEM_2866107_01_005, block NSW020502
    bbox: [150.6607, -35.1504, 150.8083, -34.9735]
    # The delivered DEM mosaic actually spans a wider AOI than the block:
    delivered_bbox: [150.655764, -35.170992, 150.864709, -34.968777]
    capture_dates: ["2018-09-08", "2018-09-09"]   # JervisBay + Beecroft
    reference_crs: "EPSG:7856"
    # Path relative to the repo root; data/raw/ is gitignored.
    reference_dem: "data/raw/JervisBay/NSW Government - DCCEEW/DEM/5 Metre/NSW_Marine_5m_TopoBathy_DEM.tif"
    # MHL ocean tide gauge in the bay. Constants from MHL's station page and
    # tidal-planes table (2018-19 column), which is in AHD despite its heading.
    tide_gauge:
      station: "216470"
      name: "Jervis Bay (HMAS Creswell)"
      ahd_offset_m: -1.07        # level_AHD = level_chart_datum - 1.07
      msl_ahd: 0.074
      islw_ahd: -0.776
      hhwss_ahd: 1.028
      source: "Manly Hydraulics Laboratory for NSW DCCEEW, CC BY 4.0; times AEST"
    # Reporting strata (never model inputs). Pre-registered with the Phase 2
    # protocol, PROJECT_BRIEF.md. Scene CRS; vertices other than the entrance
    # run through land. The only water the polygon crosses is the bay entrance:
    # Point Perpendicular -> Bowen Island -> Governor Head (checked by water
    # connectivity on the lidar mask). Outside it: the Beecroft north and east
    # coasts, the Booderee coast south of Bowen Island, Wreck/Summercloud Bay.
    strata:
      inside_bay:
        epsg: 32756
        polygon:
          - [285960, 6128400]
          - [296900, 6128400]
          - [297100, 6127500]
          - [298300, 6125000]
          - [299300, 6121000]
          - [299600, 6114550]    # Point Perpendicular
          - [296600, 6112500]    # Bowen Island, north
          - [296300, 6111300]    # Bowen Island, south-west
          - [296000, 6110500]    # Governor Head
          - [295500, 6108000]
          - [285960, 6108000]
    max_depth_m: 42.70
    testable_area_km2: 95.55     # 0-20 m band
    status: reference_in_hand

  narrabeen_long_reef:
    label: "Northern Beaches (Queenscliff - Palm Beach)"
    role: "exposed, surf-dominated open coast"
    # SydneyNorth2018_DEM_3376256_01_005, block NSW020302 (North Head - Barrenjoey).
    # AOI = the part of the block that no other block's raster reaches, in MGA56
    # E 337230-347890, N 6260100-6281900: SydneyHarbour (flown 2018-08-18) runs
    # to N 6259945 and BrokenBay (2018-08-24) starts at N 6282035. One capture
    # date, and an ELVIS order inside it is not mosaicked (data/README.md).
    # Lon/lat box inscribed in that window.
    bbox: [151.2460, -33.7867, 151.3570, -33.5918]
    capture_dates: ["2018-09-18"]   # CAPT_END from the coverage index
    reference_crs: "EPSG:7856"
    reference_dem: "data/raw/Narrabeen/NSW Government - DCCEEW/DEM/5 Metre/NSW_Marine_5m_TopoBathy_DEM.tif"
    status: reordering           # 1 Oct extract was mosaicked (resampled); native re-order pending

  # Site 3 candidates. Entries exist so sdb.stac / sdb.fetch quicklook can
  # screen the imagery around each capture date before any lidar is ordered.
  batemans_bay:
    label: "Batemans Bay / Clyde mouth"
    role: "candidate worst case — estuarine turbidity (to be confirmed from imagery)"
    # BatemansBay2018_DEM_2436036_01_005, block NSW020602; block bbox from the
    # coverage index. MoruyaCoast (2018-09-05) and Murramurang (2018-09-06)
    # rasters overlap its south and north-east corners: the lidar order must
    # avoid them.
    bbox: [150.1571, -35.7879, 150.2936, -35.6851]
    capture_dates: ["2018-08-24"]
    status: screening

  richmond_river:
    label: "Richmond River mouth (Ballina)"
    role: "candidate worst case — river plume (to be confirmed from imagery)"
    # Screening box only. The mouth sits on the seam between ByronBallina
    # (NSW010102, flown 2018-08-04) to the north and Broadwater (NSW010103,
    # 2018-07-08) to the south, at about lat -28.877.
    bbox: [153.5500, -28.9500, 153.6500, -28.8000]
    capture_dates: ["2018-07-08", "2018-08-04"]
    status: screening
