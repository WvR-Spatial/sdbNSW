# Installing the package removes the need for PYTHONPATH:
#
#   conda activate sdbnsw
#   pip install -e . --no-deps
#
# --no-deps matters. The conda env already has GDAL, rasterio and geopandas
# from conda-forge; letting pip resolve them would install PyPI wheels with
# their own bundled GDAL alongside conda's, which is the classic way to break
# a working geospatial environment on Windows.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdbnsw"
version = "0.1.0"
description = "Satellite-derived bathymetry validated against airborne lidar, NSW"
requires-python = ">=3.11"
dependencies = [
    "pystac-client>=0.8",
    "requests>=2.31",
    "numpy>=1.26",
    "shapely>=2.0",
    "scipy>=1.11",
    "affine>=2.4",
    "pillow>=10",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "geopandas>=1.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sdb-scenes = "sdb.stac:main"
sdb-fetch = "sdb.fetch:main"
sdb-coreg = "sdb.coreg:main"
sdb-reference = "sdb.reference:main"
sdb-validate = "sdb.validate:main"
sdb-substrate = "sdb.substrate:main"
sdb-clarity = "sdb.clarity:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# rasterio's own internals trip affine's `*` deprecation. Scoped to that module
# only, so the same warning from *this* code would still surface.
filterwarnings = ["ignore::PendingDeprecationWarning:rasterio.*"]
